[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-evolution-modelization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda13]==0.11.0",
    "flax==0.12.8",
    "optax==0.2.8",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "tqdm==4.70.0",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.2",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
]

[tool.setuptools]
py-modules = ["sequence_classesV1", "analysisV1", "RegressionV1", "initialize_weights", "MLP_regV1"]
package-dir = {"" = "lib"}
